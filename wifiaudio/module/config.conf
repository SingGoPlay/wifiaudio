# WiFiAudio 配置 (可在模块 WebUI 中修改)
# 主开关: 1=启用音频广播, 0=关闭(最省电)
enabled=0
# 开机自启: 1=开机自动启动(默认), 0=仅由管理器/WebUI 手动唤起
auto_start=1
# 模式预设: music=高音质稳定(大缓冲) / game=低延迟(小缓冲+UDP)
mode=music
# 本地渲染: 0=本地静音(声音只走WiFi), 1=本地照常出声
local_render=0
# 传输协议: tcp=可靠 / udp=低延迟(游戏模式自动用UDP)
transport=tcp
# TCP 流端口 (接收端 App 使用)
tcp_port=47800
# HTTP 流端口 (PC 用 VLC 播放器打开)
http_port=47801
# 编码: pcm=原始PCM / opus=高质量压缩 / aac=兼容压缩
codec=pcm
# PCM 采样率: auto=跟随设备输出能力(Hi-Res 直通) / 48000 / 96000 / 192000（仅 codec=pcm 生效）
pcm_rate=auto
# AAC 码率 kbps (仅 codec=aac 时生效)
aac_bitrate=192
# OPUS 码率 kbps (仅 codec=opus 时生效)
opus_bitrate=128
# 蜂窝通话增强捕获(尽力而为, 依赖设备支持): 1=开 0=关
capture_call=0
